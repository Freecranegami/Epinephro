name: angle-inspect
# One-off: finds prebuilt ANGLE Android libraries and prints what is in them (as annotations on the run).
on:
  push:
    paths: ['.github/workflows/angle-inspect.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Look at the abnormalmaps/build-angle releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          out=angle.txt; : > $out
          tag=angle-bb10246
          gh release download "$tag" -R abnormalmaps/build-angle -p angle-android-arm64.zip -p commit.txt -D dl >> $out 2>&1
          echo "commit.txt: $(cat dl/commit.txt)" >> $out
          mkdir x; cd x; unzip -q ../dl/angle-android-arm64.zip; cd ..
          f=x/arm64/lib/libGLESv2_angle.so
          echo "== NEEDED/SONAME GLESv2" >> $out; readelf -d $f | grep -E "SONAME|NEEDED" >> $out
          echo "== NEEDED GLESv1" >> $out; readelf -d x/arm64/lib/libGLESv1_CM_angle.so | grep -E "SONAME|NEEDED" >> $out
          echo "== loader strings" >> $out; strings $f | grep -E "^lib[a-zA-Z0-9_+.-]+\.so(\.[0-9])?$" | sort -u | head -30 >> $out
          echo "== backend hints (counts)" >> $out
          for k in "vkCreateInstance" "VK_KHR_android_surface" "VK_EXT_transform_feedback" "eglGetPlatformDisplay" "libvulkan" "angle_feature" "GL_ANGLE_" "OpenGL ES 3.2" "ANGLE (" "SwiftShader"; do echo "$k: $(strings $f | grep -c "$k")" >> $out; done
          echo "== version-ish" >> $out; strings $f | grep -iE "^[0-9a-f]{40}$|angle.*commit|git.*hash|chromium/|^ANGLE " | sort -u | head -6 >> $out
          echo "== EGL exports" >> $out; nm -D --defined-only x/arm64/lib/libEGL_angle.so | grep -E ' T (eglGetProcAddress|eglGetDisplay|eglGetPlatformDisplay|eglCreateContext|eglSwapBuffers|eglInitialize)' | awk '{print $3}' | tr '\n' ' ' >> $out
          echo >> $out
          echo "GLESv2 exports: $(nm -D --defined-only $f | grep -cE ' T gl')  ; sample: $(nm -D --defined-only $f | grep -E ' T (glGetString|glDrawElements|glTexImage2D|eglGetProcAddress)' | awk '{print $3}' | tr '\n' ' ')" >> $out
          echo "EGL needs which GLES: $(strings x/arm64/lib/libEGL_angle.so | grep -E 'GLES|angle' | sort -u | tr '\n' ' ')" >> $out
          msg=$(head -c 9000 $out); msg="${msg//'%'/'%25'}"; msg="${msg//$'\n'/'%0A'}"
          echo "::notice title=angle-inspect::$msg"
