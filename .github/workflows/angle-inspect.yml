name: angle-inspect
# One-off: finds prebuilt ANGLE Android libraries and prints what is in them (as annotations on the run).
on:
  push:
    paths: ['.github/workflows/angle-inspect.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Look at the abnormalmaps/build-angle releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          out=angle.txt; : > $out
          echo "== releases" >> $out
          gh api "repos/abnormalmaps/build-angle/releases?per_page=6" -q '.[]|.tag_name+" "+.published_at+" :: "+(.assets|map(.name+"("+(.size|tostring)+")")|join(" "))' >> $out 2>&1
          echo "== repo" >> $out
          gh api repos/abnormalmaps/build-angle -q '.description+" | license: "+(.license.spdx_id//"none")' >> $out 2>&1
          tag=$(gh api "repos/abnormalmaps/build-angle/releases?per_page=1" -q '.[0].tag_name')
          asset=$(gh api "repos/abnormalmaps/build-angle/releases/tags/$tag" -q '.assets[]|select(.name|test("android";"i"))|.name' | head -5)
          echo "tag $tag; android assets: $asset" >> $out
          a=$(echo "$asset" | grep -i "arm64" | head -1); [ -n "$a" ] || a=$(echo "$asset" | head -1)
          if [ -n "$a" ]; then
            gh release download "$tag" -R abnormalmaps/build-angle -p "$a" -D dl >> $out 2>&1
            ls -l dl >> $out
            mkdir x; cd x
            case "$a" in *.zip) unzip -q ../dl/$a;; *.tar.gz|*.tgz) tar xzf ../dl/$a;; *.tar.xz) tar xJf ../dl/$a;; esac
            cd ..
            echo "== files" >> $out; (cd x && find . -type f | sort | head -60 | xargs ls -l) >> $out 2>&1
            for f in $(find x -name '*.so' | head -6); do
              echo "== $f" >> $out
              readelf -d "$f" | grep -E "SONAME|NEEDED" >> $out
              echo "vulkan strings:" >> $out; strings "$f" | grep -iE "^libvulkan|vulkan\.so|libGLESv2|libEGL" | sort -u | head -8 >> $out
              echo "exports egl/gl: $(nm -D --defined-only "$f" | grep -cE ' T (egl|gl)')" >> $out
            done
            echo "== licence-like" >> $out; (cd x && find . -iname '*licen*' -o -iname '*notice*') >> $out
          fi
          msg=$(head -c 9000 $out); msg="${msg//'%'/'%25'}"; msg="${msg//$'\n'/'%0A'}"
          echo "::notice title=angle-inspect::$msg"
