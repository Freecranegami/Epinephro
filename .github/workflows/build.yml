name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Fetch ANGLE (OpenGL ES on Vulkan)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/angle_fetch.py 2>&1 | tee angle.log || echo "::warning::ANGLE was not bundled"
          for f in app/src/main/jniLibs/arm64-v8a/*.so; do
            echo "== $f"; readelf -d "$f" | grep -E "SONAME|NEEDED"
            echo "env strings: $(strings "$f" | grep -E 'ANGLE_[A-Z_]+' | sort -u | tr '\n' ' ')"
          done 2>&1 | tee -a angle.log
          msg=$(head -c 6000 angle.log); msg="${msg//'%'/'%25'}"; msg="${msg//$'\n'/'%0A'}"
          echo "::notice title=angle::$msg"
      - name: Build
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
      - name: Show build errors in the run summary
        if: failure()
        run: |
          msg=$(grep -aE '^e: |error:|AAPT|What went wrong|Execution failed' -A2 build.log | head -40 | cut -c1-300)
          msg="${msg//'%'/'%25'}"
          msg="${msg//$'\n'/'%0A'}"
          echo "::error title=Build errors::$msg"
      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/adrenotest.apk
          cp guestgame/build/outputs/apk/debug/guestgame-debug.apk dist/guestgame.apk
      - name: Backup download (zipped)
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: dist/*.apk
      - name: Publish a versioned release (main app only) when RELEASE names a new tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # RELEASE: line 1 tag, line 2 title, line 3 "new" or "replace" (recreate an existing release), then the notes
          [ -f RELEASE ] || exit 0
          tag=$(sed -n 1p RELEASE); title=$(sed -n 2p RELEASE); mode=$(sed -n 3p RELEASE); notes=$(sed -n '4,$p' RELEASE)
          [ -n "$tag" ] || exit 0
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$mode" = "replace" ]; then gh release delete "$tag" --cleanup-tag --yes
            else echo "release $tag already exists"; exit 0; fi
          fi
          # the released app is a separate build with its own package name
          gradle :app:assembleDebug --no-daemon -PappId=com.freecrane.epinephro -PappLabel=Epinephro
          cp app/build/outputs/apk/debug/app-debug.apk epinephro.apk
          gh release create "$tag" epinephro.apk --target "$GITHUB_SHA" --prerelease --title "$title" --notes "$notes"
