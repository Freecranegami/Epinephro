name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
      - name: Show build errors in the run summary
        if: failure()
        run: |
          msg=$(grep -aE '^e: |error:|AAPT|What went wrong|Execution failed' -A2 build.log | head -40 | cut -c1-300)
          msg="${msg//'%'/'%25'}"
          msg="${msg//$'\n'/'%0A'}"
          echo "::error title=Build errors::$msg"
      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/epinephro.apk
          cp guestgame/build/outputs/apk/debug/guestgame-debug.apk dist/guestgame.apk
      - name: Backup download (zipped)
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: dist/*.apk
      - name: Publish a versioned release (main app only) when RELEASE names a new tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f RELEASE ] || exit 0
          tag=$(sed -n 1p RELEASE); title=$(sed -n 2p RELEASE); notes=$(sed -n '3,$p' RELEASE)
          [ -n "$tag" ] || exit 0
          if gh release view "$tag" >/dev/null 2>&1; then echo "release $tag already exists"; exit 0; fi
          gh release create "$tag" dist/epinephro.apk --target "$GITHUB_SHA" --prerelease --title "$title" --notes "$notes"
